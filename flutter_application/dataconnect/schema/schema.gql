type User @table {
  email: String!
  displayName: String!
  createdAt: Timestamp!
  photoUrl: String
  isAdmin: Boolean
}

type Product @table {
  name: String!
  description: String!
  price: Float!
  stockQuantity: Int!
  createdAt: Timestamp!
  imageUrl: String
  weight: Float
}

type Category @table {
  name: String!
  createdAt: Timestamp!
  description: String
}

type ProductCategory @table(key: ["product", "category"]) {
  product: Product!
  category: Category!
}

type CartItem @table {
  user: User!
  product: Product!
  quantity: Int!
  createdAt: Timestamp!
}

type Order @table {
  user: User!
  orderDate: Timestamp!
  totalAmount: Float!
  status: String!
}

type OrderItem @table {
  order: Order!
  product: Product!
  quantity: Int!
  priceAtTimeOfPurchase: Float!
}